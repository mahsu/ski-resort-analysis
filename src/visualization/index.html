<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ski Resort Run Steepness Comparison</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-top">
      <span class="header-icon">⛷</span>
      <h1>Ski Resort Run Steepness</h1>
    </div>
    <div class="controls">
      <div class="control-row">
        <label class="resort-select-label"><span class="resort-dot a"></span> Resort A</label>
        <div class="resort-combobox" id="resort-a-wrap">
          <input type="text" id="resort-a" autocomplete="off" spellcheck="false" placeholder="Search resort…" aria-label="Select first resort" aria-autocomplete="list" aria-haspopup="listbox">
          <button class="resort-clear" id="resort-a-clear" aria-label="Clear resort" hidden>✕</button>
          <ul class="resort-dropdown" id="resort-a-dropdown" role="listbox" hidden></ul>
        </div>
        <label class="resort-select-label"><span class="resort-dot b"></span> Resort B</label>
        <div class="resort-combobox" id="resort-b-wrap">
          <input type="text" id="resort-b" autocomplete="off" spellcheck="false" placeholder="Search resort…" aria-label="Select second resort" aria-autocomplete="list" aria-haspopup="listbox">
          <button class="resort-clear" id="resort-b-clear" aria-label="Clear resort" hidden>✕</button>
          <ul class="resort-dropdown" id="resort-b-dropdown" role="listbox" hidden></ul>
        </div>
      </div>
      <div class="control-row">
        <span class="toggle-label">Pitch metric</span>
        <div class="toggle" role="group" aria-label="Pitch metric">
          <button type="button" id="metric-avg" class="toggle-btn active">Average</button>
          <button type="button" id="metric-max" class="toggle-btn">Max</button>
        </div>
      </div>
      <div class="control-row">
        <span class="toggle-label">Chart style</span>
        <div class="toggle" role="group" aria-label="Chart style">
          <button type="button" id="chart-bars" class="toggle-btn active">Stacked Bars</button>
          <button type="button" id="chart-lines" class="toggle-btn">Smooth Lines</button>
        </div>
      </div>
      <div class="control-row checkboxes">
        <label class="checkbox">
          <input type="checkbox" id="show-aggregate" checked>
          All-resorts aggregate
        </label>
        <label class="checkbox">
          <input type="checkbox" id="normalize-y">
          Normalize to % of runs
        </label>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="chart-wrap">
      <div id="chart" class="chart"></div>
      <div id="tooltip" class="tooltip" aria-hidden="true"></div>
    </div>

    <aside class="sidebar">
      <div class="sidebar-left">
        <section class="legend">
          <div id="resort-legend-wrap" style="display:none">
            <h2>Resorts</h2>
            <div class="legend-items" id="resort-legend"></div>
          </div>
          <h2>Difficulty <span id="difficulty-legend-note" class="legend-subhead"></span></h2>
          <div class="legend-items" id="legend"></div>
          <p class="legend-note aggregate-note">All-resorts aggregate</p>
        </section>
        <section class="stats">
          <h2>Stats</h2>
          <div id="stats-a" class="stat-card"></div>
          <div id="stats-b" class="stat-card"></div>
        </section>
      </div>
      <div class="sidebar-right">
        <section class="insights">
          <h2>Insights</h2>
          <div id="insights" class="insight-cards"></div>
        </section>
      </div>
    </aside>
  </main>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
